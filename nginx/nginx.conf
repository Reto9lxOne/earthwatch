worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript;

    server {
        listen 80;
        server_name earthwatch.9lx.io grafana.9lx.io;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name earthwatch.9lx.io;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://web-next:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # NASA DONKI proxy — key stays on server
        location /api/donki/ {
            proxy_pass http://proxy:3000/donki/;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin *;
        }

        # Ships snapshot — REST
        location /api/ships/ {
            proxy_pass http://proxy:3000/ships/;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin *;
        }

        # Ships live — WebSocket
        location /ws/ships {
            proxy_pass          http://proxy:3000/ws/ships;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
        }

        # Proxy health
        location /api/health {
            proxy_pass http://proxy:3000/health;
            proxy_set_header Host $host;
        }

        location /assets/ {
            proxy_pass http://web-next:3001/assets/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        location /health {
            proxy_pass http://web-next:3001/health;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 443 ssl;
        server_name grafana.9lx.io;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         http://grafana:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
