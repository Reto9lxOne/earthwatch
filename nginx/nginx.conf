worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript;

    # ── Redirect HTTP → HTTPS ──────────────────────────────
    server {
        listen 80;
        server_name earthwatch.9lx.io grafana.9lx.io;
        return 301 https://$host$request_uri;
    }

    # ── earthwatch.9lx.io — Main Dashboard ────────────────
    server {
        listen 443 ssl;
        server_name earthwatch.9lx.io;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Static dashboard files
        root  /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ADSB Proxy API — proxied internally, no CORS issues
        location /api/adsb/ {
            proxy_pass http://proxy:3000/adsb/;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin *;
        }

        # Health check
        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }

    # ── grafana.9lx.io — Grafana ──────────────────────────
    server {
        listen 443 ssl;
        server_name grafana.9lx.io;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         http://grafana:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            # WebSocket support (Grafana Live)
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
