worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript;

    server {
        listen 80;
        server_name earthwatch.9lx.app earthwatch.9lx.io;

        location / {
            proxy_pass http://web-next:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/donki/ {
            proxy_pass http://proxy:3000/donki/;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin *;
        }

        location /api/ships/ {
            proxy_pass http://proxy:3000/ships/;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin *;
        }

        location /ws/ships {
            proxy_pass          http://proxy:3000/ws/ships;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection upgrade;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
        }

        location /ws/lightning {
            proxy_pass          http://proxy:3000/ws/lightning;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection upgrade;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
        }

        location /api/lightning/ {
            proxy_pass http://proxy:3000/lightning/;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin *;
        }


        location /api/satellites/ {
            proxy_pass http://proxy:3000/satellites/;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin *;
        }
        location /api/events {
            proxy_pass http://proxy:3000/events;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin *;
        }

        location /api/earthquakes {
            proxy_pass http://proxy:3000/earthquakes;
            proxy_set_header Host $host;
            add_header Access-Control-Allow-Origin *;
        }

        location /api/health {
            proxy_pass http://proxy:3000/health;
            proxy_set_header Host $host;
        }

        location /assets/ {
            proxy_pass http://web-next:3001/assets/;
            proxy_set_header Host $host;
            expires 1h;
        }

        location /health {
            proxy_pass http://web-next:3001/health;
            proxy_set_header Host $host;
        }
    }
}
