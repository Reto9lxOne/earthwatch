apiVersion: 1

groups:
  - orgId: 1
    name: Earthwatch Alerts
    folder: Earthwatch
    interval: 5m
    rules:

      # ── Strong Earthquake Alert ──────────────────────────
      - uid: alert-earthquake-strong
        title: "🔴 Strong Earthquake M5.0+"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: timescaledb
            model:
              rawSql: |
                SELECT COUNT(*) AS count
                FROM earthquakes
                WHERE time > NOW() - INTERVAL '1 hour'
                  AND magnitude >= 5.0
              format: table
              refId: A
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
        noDataState: OK
        execErrState: OK
        for: 0m
        annotations:
          summary: "Strong earthquake M5.0+ detected"
          description: "A strong earthquake was detected. Check https://earthwatch.9lx.app for details."
        labels:
          severity: warning
          category: earthquake
        isPaused: false

      # ── Major Earthquake Alert ───────────────────────────
      - uid: alert-earthquake-major
        title: "🚨 Major Earthquake M7.0+"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: timescaledb
            model:
              rawSql: |
                SELECT COUNT(*) AS count
                FROM earthquakes
                WHERE time > NOW() - INTERVAL '1 hour'
                  AND magnitude >= 7.0
              format: table
              refId: A
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
        noDataState: OK
        execErrState: OK
        for: 0m
        annotations:
          summary: "MAJOR earthquake M7.0+ detected!"
          description: "A major earthquake was recorded. Tsunami risk possible. Check https://earthwatch.9lx.app"
        labels:
          severity: critical
          category: earthquake
        isPaused: false

      # ── Tsunami Warning ──────────────────────────────────
      - uid: alert-tsunami
        title: "🌊 Tsunami Warning"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: timescaledb
            model:
              rawSql: |
                SELECT COUNT(*) AS count
                FROM earthquakes
                WHERE time > NOW() - INTERVAL '1 hour'
                  AND tsunami = true
              format: table
              refId: A
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
        noDataState: OK
        execErrState: OK
        for: 0m
        annotations:
          summary: "Tsunami warning issued!"
          description: "A tsunami-generating earthquake was detected. Check https://earthwatch.9lx.app"
        labels:
          severity: critical
          category: tsunami
        isPaused: false

      # ── Solar Storm Alert ────────────────────────────────
      - uid: alert-solar-storm
        title: "☀️ Geomagnetic Storm Kp5+"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: timescaledb
            model:
              rawSql: |
                SELECT COUNT(*) AS count
                FROM solar_events
                WHERE time > NOW() - INTERVAL '6 hours'
                  AND event_type = 'GST'
                  AND kp_index >= 5
              format: table
              refId: A
          - refId: C
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
        noDataState: OK
        execErrState: OK
        for: 0m
        annotations:
          summary: "Geomagnetic storm Kp5+ detected"
          description: "Strong solar activity may affect GPS, radio and power grids."
        labels:
          severity: warning
          category: solar
        isPaused: false

      # ── Collector Health Alert ───────────────────────────
      - uid: alert-collector-down
        title: "⚠️ Collector Not Running"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: timescaledb
            model:
              rawSql: |
                SELECT COUNT(*) AS count
                FROM collector_runs
                WHERE time > NOW() - INTERVAL '30 minutes'
                  AND success = true
              format: table
              refId: A
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 10m
        annotations:
          summary: "Data collector has not run in 30 minutes"
          description: "Check earthwatch-collector container logs on prd-eaw01."
        labels:
          severity: warning
          category: system
        isPaused: false
