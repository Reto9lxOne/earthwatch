apiVersion: 1

groups:
  - orgId: 1
    name: Earthwatch Alerts
    folder: Earthwatch
    interval: 5m
    rules:

      # ── Strong Earthquake Alert ──────────────────────────
      - uid: alert-earthquake-strong
        title: "🔴 Strong Earthquake M5.5+"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: timescaledb
            model:
              rawSql: |
                SELECT
                  place     AS location,
                  ROUND(magnitude::numeric, 1)::text AS magnitude,
                  1         AS value
                FROM earthquakes
                WHERE time > NOW() - INTERVAL '1 hour'
                  AND magnitude >= 5.5
                ORDER BY magnitude DESC
                LIMIT 1
              format: table
              refId: A
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: reduce
              refId: C
              expression: A
              reducer: last
              settings:
                mode: dropNN
        noDataState: OK
        execErrState: OK
        for: 0m
        annotations:
          summary: "Erdbeben M{{ $labels.magnitude }} erkannt"
          location: "{{ $labels.location }}"
        labels:
          severity: warning
          category: earthquake
        isPaused: false

      # ── Significant Earthquake Alert ────────────────────
      - uid: alert-earthquake-significant
        title: "🟠 Significant Earthquake M6.0+"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: timescaledb
            model:
              rawSql: |
                SELECT
                  place     AS location,
                  ROUND(magnitude::numeric, 1)::text AS magnitude,
                  1         AS value
                FROM earthquakes
                WHERE time > NOW() - INTERVAL '1 hour'
                  AND magnitude >= 6.0
                ORDER BY magnitude DESC
                LIMIT 1
              format: table
              refId: A
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: reduce
              refId: C
              expression: A
              reducer: last
              settings:
                mode: dropNN
        noDataState: OK
        execErrState: OK
        for: 0m
        annotations:
          summary: "Erdbeben M{{ $labels.magnitude }} — {{ $labels.location }}"
        labels:
          severity: warning
          category: earthquake
        isPaused: false

      # ── Major Earthquake Alert ───────────────────────────
      - uid: alert-earthquake-major
        title: "🚨 Major Earthquake M7.0+"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: timescaledb
            model:
              rawSql: |
                SELECT
                  place     AS location,
                  ROUND(magnitude::numeric, 1)::text AS magnitude,
                  1         AS value
                FROM earthquakes
                WHERE time > NOW() - INTERVAL '1 hour'
                  AND magnitude >= 7.0
                ORDER BY magnitude DESC
                LIMIT 1
              format: table
              refId: A
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: reduce
              refId: C
              expression: A
              reducer: last
              settings:
                mode: dropNN
        noDataState: OK
        execErrState: OK
        for: 0m
        annotations:
          summary: "MAJOR Erdbeben M{{ $labels.magnitude }} — Tsunami möglich!"
          location: "{{ $labels.location }}"
        labels:
          severity: critical
          category: earthquake
        isPaused: false

      # ── Tsunami Warning ──────────────────────────────────
      - uid: alert-tsunami
        title: "🌊 Tsunami Warning"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: timescaledb
            model:
              rawSql: |
                SELECT
                  place     AS location,
                  ROUND(magnitude::numeric, 1)::text AS magnitude,
                  1         AS value
                FROM earthquakes
                WHERE time > NOW() - INTERVAL '1 hour'
                  AND tsunami = true
                ORDER BY magnitude DESC
                LIMIT 1
              format: table
              refId: A
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: reduce
              refId: C
              expression: A
              reducer: last
              settings:
                mode: dropNN
        noDataState: OK
        execErrState: OK
        for: 0m
        annotations:
          summary: "Tsunami-Warnung! Erdbeben M{{ $labels.magnitude }}"
          location: "{{ $labels.location }}"
        labels:
          severity: critical
          category: tsunami
        isPaused: false

      # ── Solar Storm Alert ────────────────────────────────
      - uid: alert-solar-storm
        title: "☀️ Geomagnetic Storm Kp5+"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: timescaledb
            model:
              rawSql: |
                SELECT COUNT(*) AS count
                FROM solar_events
                WHERE time > NOW() - INTERVAL '6 hours'
                  AND event_type = 'GST'
                  AND kp_index >= 5
              format: table
              refId: A
          - refId: C
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
        noDataState: OK
        execErrState: OK
        for: 0m
        annotations:
          summary: "Geomagnetischer Sturm Kp5+ — Aurora möglich, GPS/Radio/Stromnetz betroffen"
        labels:
          severity: warning
          category: solar
        isPaused: false

      # ── Internet Outage Alert ────────────────────────────
      - uid: alert-internet-outage
        title: "🌐 Internet Outage (Critical)"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: timescaledb
            model:
              rawSql: |
                SELECT entity_name AS country, 1 AS value
                FROM outage_events
                WHERE time > NOW() - INTERVAL '15 minutes'
                  AND level = 'critical'
                ORDER BY time DESC
                LIMIT 1
              format: table
              refId: A
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "__expr__"
            model:
              type: reduce
              refId: C
              expression: A
              reducer: last
              settings:
                mode: dropNN
        noDataState: OK
        execErrState: OK
        for: 0m
        annotations:
          summary: "Internet-Ausfall: {{ $labels.country }}"
        labels:
          severity: warning
          category: internet
        isPaused: false

      # ── Collector Health Alert ───────────────────────────
      - uid: alert-collector-down
        title: "⚠️ Collector Not Running"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: timescaledb
            model:
              rawSql: |
                SELECT COUNT(*) AS count
                FROM collector_runs
                WHERE time > NOW() - INTERVAL '30 minutes'
                  AND success = true
              format: table
              refId: A
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 10m
        annotations:
          summary: "Collector seit 30 Min. nicht aktiv — Daten veraltet"
        labels:
          severity: warning
          category: system
        isPaused: false
