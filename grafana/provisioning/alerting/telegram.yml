apiVersion: 1

contactPoints:
  - orgId: 1
    name: Telegram
    receivers:
      - uid: telegram-receiver
        type: telegram
        settings:
          bottoken: "${TELEGRAM_BOT_TOKEN}"
          chatid: !!str 31791262
          message: |
            {{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} *Earthwatch — {{ (index .Alerts 0).Labels.alertname }}*

            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ if .Annotations.location }}📍 {{ .Annotations.location }}{{ end }}
            🕐 {{ .StartsAt.UTC.Format "02 Jan 2006 15:04 UTC" }}
            {{ end }}
            🌍 https://earthwatch.9lx.app
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: Telegram
    group_by: ['alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
