services:

  # ─────────────────────────────────────
  # NGINX — Reverse Proxy + Static Files
  # ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: earthwatch-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./dashboard:/usr/share/nginx/html:ro
    depends_on:
      - grafana
      - proxy
    networks:
      - earthwatch

  # ─────────────────────────────────────
  # TIMESCALEDB — Time-Series Database
  # ─────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: earthwatch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: earthwatch
      POSTGRES_USER: earthwatch
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"   # only localhost, not exposed externally
    networks:
      - earthwatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthwatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────
  # GRAFANA — Dashboards + Alerts
  # ─────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: earthwatch-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_DOMAIN: grafana.9lx.io
      GF_SERVER_ROOT_URL: https://grafana.9lx.io
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-worldmap-panel,grafana-clock-panel
      # Telegram alerting
      GF_ALERTING_ENABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - earthwatch

  # ─────────────────────────────────────
  # COLLECTOR — API Poller → TimescaleDB
  # ─────────────────────────────────────
  collector:
    build: ./collector
    container_name: earthwatch-collector
    restart: unless-stopped
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: earthwatch
      DB_USER: earthwatch
      DB_PASSWORD: ${DB_PASSWORD}
      POLL_INTERVAL_MINUTES: 5
      NASA_API_KEY: ${NASA_API_KEY}   # replace with your key for higher rate limits
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - earthwatch

  # ─────────────────────────────────────
  # PROXY — ADSB + CORS Proxy
  # ─────────────────────────────────────
  proxy:
    build: ./proxy
    container_name: earthwatch-proxy
    restart: unless-stopped
    environment:
      PORT: 3000
      AISSTREAM_TOKEN: ${AISSTREAM_TOKEN}
    networks:
      - earthwatch

volumes:
  timescaledb_data:
  grafana_data:

networks:
  earthwatch:
    driver: bridge
