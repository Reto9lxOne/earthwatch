services:

  # ─────────────────────────────────────
  # NGINX — Reverse Proxy + Static Files
  # ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: earthwatch-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - grafana
      - proxy
      - web-next
    networks:
      - earthwatch
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ─────────────────────────────────────
  # TIMESCALEDB — Time-Series Database
  # ─────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: earthwatch-db
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      POSTGRES_DB: earthwatch
      POSTGRES_USER: earthwatch
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"   # only localhost, not exposed externally
    networks:
      - earthwatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthwatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────
  # GRAFANA — Dashboards + Alerts
  # ─────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: earthwatch-grafana
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      GF_SERVER_DOMAIN: eaw-dash.9lx.app
      GF_SERVER_ROOT_URL: https://eaw-dash.9lx.app
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel
      # Telegram alerting
      GF_ALERTING_ENABLED: "true"
      DB_PASSWORD: ${DB_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - earthwatch

  # ─────────────────────────────────────
  # COLLECTOR — API Poller → TimescaleDB
  # ─────────────────────────────────────
  collector:
    build: ./collector
    container_name: earthwatch-collector
    restart: unless-stopped
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: earthwatch
      DB_USER: earthwatch
      DB_PASSWORD: ${DB_PASSWORD}
      POLL_INTERVAL_MINUTES: 5
      NASA_API_KEY: ${NASA_API_KEY}   # replace with your key for higher rate limits
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - earthwatch

  # ─────────────────────────────────────
  # PROXY — ADSB + CORS Proxy
  # ─────────────────────────────────────
  proxy:
    build: ./proxy
    container_name: earthwatch-proxy
    restart: unless-stopped
    environment:
      PORT: 3000
      AISSTREAM_TOKEN: ${AISSTREAM_TOKEN}
      NASA_API_KEY: ${NASA_API_KEY}
    networks:
      - earthwatch

  # ─────────────────────────────────────
  # WEB-NEXT — Next-generation Web/API
  # ─────────────────────────────────────
  web-next:
    build: ./web-next
    container_name: earthwatch-web-next
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      LOG_LEVEL: info
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: earthwatch
      DB_USER: earthwatch
      DB_PASSWORD: ${DB_PASSWORD}
      WINDY_WEBCAMS_KEY: ${WINDY_WEBCAMS_KEY}
      WAQI_TOKEN: ${WAQI_TOKEN}
      CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN}
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - earthwatch

  # ---------------------------------------------------------------
  # Docker Status Collector - Docker inventory and health metrics
  # ---------------------------------------------------------------
  docker-status-collector:
    build: ./docker-status-collector
    container_name: earthwatch-docker-status-collector
    restart: unless-stopped
    environment:
      COLLECTOR_HOSTNAME: prd-eaw01
      CACHE_TTL_SECONDS: "10"
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - earthwatch

  # node-exporter runs as a systemd service on this host (port 9100)
  # — no Docker container needed

  # ─────────────────────────────────────
  # WATCHTOWER — Automatic image updates
  # ─────────────────────────────────────
  watchtower:
    image: containrrr/watchtower
    container_name: earthwatch-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCHEDULE: "0 0 3 * * *"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_NOTIFICATION_URL: "telegram://${WATCHTOWER_BOT_TOKEN}@telegram?chats=${TELEGRAM_CHAT_ID}"
      WATCHTOWER_NOTIFICATIONS_LEVEL: "warning"
      DOCKER_API_VERSION: "1.41"
    networks:
      - earthwatch

volumes:
  timescaledb_data:
  grafana_data:

networks:
  earthwatch:
    driver: bridge
